 const p=pascua(y);const off=n=>{const d=new Date(p);d.setDate(d.getDate()+n);return d};
 add(off(-3));add(off(-2));add(lunes(off(39)));add(lunes(off(60)));add(lunes(off(68)));
 return cacheF[y]=s}
function esHabil(s){const d=fecha(s);const w=d.getDay();return w!==0&&w!==6&&!festivos(d.getFullYear()).has(s)}
function siguienteHabil(s){let d=fecha(s);while(!esHabil(iso(d)))d.setDate(d.getDate()+1);return iso(d)}
function sumarHabiles(s,n){let d=fecha(s),c=0;while(c<n){d.setDate(d.getDate()+1);if(esHabil(iso(d)))c++}return iso(d)}
function sumarMeses(s,m){const[y,mo,d]=s.split("-").map(Number);const t=new Date(y,mo-1+m,1);const ult=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,ult));return iso(t)}
const sumarAnios=(s,a)=>sumarMeses(s,a*12);
function finMes(s){const[y,mo]=s.split("-").map(Number);return iso(new Date(y,mo,0))}
const venceHabil=s=>siguienteHabil(s); // si el plazo termina en día no hábil, se corre al siguiente hábil
function dias(s,hoy){return Math.round((fecha(s)-fecha(hoy))/864e5)}

const TIPO={pi:"Patente de invención",mu:"Modelo de utilidad",di:"Diseño industrial",ma:"Marca",da:"Derecho de autor (software)",si:"Secreto industrial",ob:"Derecho de autor (obra escrita)"};
function clase(mod){for(const k in TIPO)if(TIPO[k]===mod)return k;return"mu"}

/* Eventos legales derivados de las fechas del expediente */
function eventos(p){
 const ev=[];const k=clase(p.modalidad);const hechos=p.hechos||{};
 const R=valida(p.fechaRadicacion)?p.fechaRadicacion:null;
 const add=(o)=>{const auto=!!o.hecho;o.auto=auto;o.hecho=!!hechos[o.clave]||auto;ev.push(o)};
 const neg=valida(p.fechaNegacion)?p.fechaNegacion:null;
 const conc=valida(p.fechaConcesion)?p.fechaConcesion:null;

 if(k==="pi"||k==="mu"){

   add({clave:"divulgacion",tipo:"Radicar antes de perder la novedad",vence:lim,critico:true,norma:"Art. 17 D. 486",nota:"La divulgación hecha por el inventor no destruye la novedad si se radica (o se invoca prioridad) dentro del año siguiente.",hecho:!!ref&&ref<=lim})}
  if(!R)return ev;
  const base=valida(p.fechaPrioridad)&&p.fechaPrioridad<R?p.fechaPrioridad:R;
  add({clave:"forma-sic",tipo:"Examen de forma (lo hace la SIC)",vence:sumarHabiles(R,h(30)),info:true,norma:"Arts. 38 y 85 D. 486",nota:"Si hay defectos, la SIC le notifica un requerimiento."});
  if(base===R)add({clave:"prioridad",opcional:true,tipo:"Último día para pedir protección en otros países con esta fecha",vence:venceHabil(sumarMeses(R,12)),norma:"Art. 9 D. 486 / Convenio de París",nota:"Después de esta fecha puede patentar en otros países, pero sin la prioridad colombiana."});
  else add({clave:"copia-prioridad",tipo:"Entregar copia certificada de la solicitud de prioridad",vence:venceHabil(sumarMeses(R,3)),critico:true,norma:"Art. 10 D. 486",nota:"Si no se entrega, se pierde el derecho de prioridad."});
  if(valida(p.fechaReqForma)){const v=sumarMeses(p.fechaReqForma,mitad?1:2);const vf=p.prorrogaForma?sumarMeses(v,mitad?1:2):v;
   add({clave:"forma-resp-"+p.fechaReqForma,tipo:"Responder requerimiento de forma",vence:venceHabil(vf),critico:true,norma:"Arts. 39 y 85 D. 486",nota:(p.prorrogaForma?"Incluye la prórroga. ":"Prorrogable una vez por el mismo plazo. ")+"Si no responde, la solicitud se considera abandonada."})}
  if(neg){add({clave:"recurso-"+neg,tipo:"Recurso de reposición contra la negación",vence:sumarHabiles(neg,10),critico:true,norma:"Art. 76 CPACA",nota:"10 días hábiles desde la notificación. Después de este plazo la negación queda en firme."});return ev}
  const pub=valida(p.fechaPublicacion)?p.fechaPublicacion:null;
  const pubEst=sumarMeses(base,mitad?12:18);
  if(!pub)add({clave:"publicacion",tipo:"Publicación en la Gaceta (estimada)",vence:pubEst,info:true,estimado:true,norma:mitad?"Art. 85 D. 486 (12 meses)":"Art. 40 D. 486 (18 meses)",nota:"Puede pedir que se publique antes. Al publicarse, escriba la fecha real en el expediente."});
  const P=pub||pubEst;
  if(pub)add({clave:"oposicion",tipo:"Vigilar oposiciones de terceros",vence:sumarHabiles(pub,h(60)),info:true,norma:"Arts. 42 y 85 D. 486",nota:"Si alguien se opone, la SIC le dará traslado para responder."});
  add({clave:"pedir-fondo",tipo:"Pedir el examen de patentabilidad y pagar la tasa",vence:venceHabil(sumarMeses(P,mitad?3:6)),critico:true,estimado:!pub,hecho:valida(p.fechaPeticionFondo),norma:"Arts. 44 y 85 D. 486",nota:"Si no se pide a tiempo, la solicitud cae en abandono. Puede pedirse desde la radicación."});
  if(valida(p.fechaReqFondo)){const v=sumarHabiles(p.fechaReqFondo,h(60));const vf=p.prorrogaFondo?sumarHabiles(v,h(30)):v;
   add({clave:"fondo-resp-"+p.fechaReqFondo,tipo:"Responder requerimiento del examen de fondo",vence:vf,critico:true,norma:"Arts. 45 y 85 D. 486",nota:(p.prorrogaFondo?"Incluye la prórroga. ":`Prorrogable una vez por ${h(30)} días hábiles. `)+"Si no responde, la SIC decide con lo que tenga."})}
  for(let a=1;a<anios;a++){const v=finMes(sumarAnios(R,a));
   add({clave:"anualidad-"+(a+1),tipo:`Anualidad del año ${a+1} de vigencia`,vence:venceHabil(v),gracia:venceHabil(sumarMeses(v,6)),norma:"Arts. 80 y 85 D. 486",nota:"Se paga por año adelantado; vence el último día del mes aniversario de la radicación y hay 6 meses de gracia con recargo. Si no se paga, la patente o la solicitud caduca. Confirme el valor en la tabla de tasas vigente de la SIC."})}
  if(conc)add({clave:"explotacion",tipo:"Explotar o licenciar la invención",vence:[sumarAnios(conc,3),sumarAnios(R,4)].sort().pop(),norma:"Art. 61 D. 486",nota:"Si no se explota ni se licencia, un tercero puede pedir licencia obligatoria."});
  add({clave:"fin",tipo:conc?"Fin de la vigencia: pasa a dominio público":"Fin de la vigencia (si se concede)",vence:sumarAnios(R,anios),info:true,estimado:!conc,norma:mitad?"Art. 84 D. 486 (10 años)":"Art. 50 D. 486 (20 años)",nota:"No se puede renovar."});
 }
 else if(k==="di"){
  if(!R)return ev;

  if(base===R)add({clave:"prioridad",opcional:true,tipo:"Último día para pedir protección en otros países con esta fecha",vence:venceHabil(sumarMeses(R,6)),norma:"Art. 9 D. 486 (6 meses)"});
  else add({clave:"copia-prioridad",tipo:"Entregar copia certificada de la solicitud de prioridad",vence:venceHabil(sumarMeses(R,3)),critico:true,norma:"Art. 10 D. 486"});
  if(valida(p.fechaReqForma)){const v=sumarHabiles(p.fechaReqForma,30);const vf=p.prorrogaForma?sumarHabiles(v,30):v;
   add({clave:"forma-resp-"+p.fechaReqForma,tipo:"Responder requerimiento de forma",vence:vf,critico:true,norma:"Art. 120 D. 486",nota:p.prorrogaForma?"Incluye la prórroga.":"Prorrogable una vez por 30 días hábiles."})}
  if(neg){add({clave:"recurso-"+neg,tipo:"Recurso de reposición contra la negación",vence:sumarHabiles(neg,10),critico:true,norma:"Art. 76 CPACA"});return ev}
  if(valida(p.fechaPublicacion))add({clave:"oposicion",tipo:"Vigilar oposiciones de terceros",vence:sumarHabiles(p.fechaPublicacion,30),info:true,norma:"Art. 122 D. 486"});
  add({clave:"fin",tipo:conc?"Fin de la vigencia: pasa a dominio público":"Fin de la vigencia (si se concede)",vence:sumarAnios(R,10),info:true,estimado:!conc,norma:"Art. 128 D. 486 (10 años)",nota:"No se puede renovar."});
 }
 else if(k==="ma"){
  if(!R)return ev;
  if(!(valida(p.fechaPrioridad)&&p.fechaPrioridad<R))add({clave:"prioridad",opcional:true,tipo:"Último día para pedir la marca en otros países con esta fecha",vence:venceHabil(sumarMeses(R,6)),norma:"Art. 9 D. 486 (6 meses)"});
  if(valida(p.fechaReqForma))add({clave:"forma-resp-"+p.fechaReqForma,tipo:"Responder requerimiento de forma",vence:sumarHabiles(p.fechaReqForma,60),critico:true,norma:"Art. 144 D. 486"});
  if(neg){add({clave:"recurso-"+neg,tipo:"Recurso de reposición contra la negación",vence:sumarHabiles(neg,10),critico:true,norma:"Art. 76 CPACA"});return ev}
  if(valida(p.fechaPublicacion))add({clave:"oposicion",tipo:"Vigilar oposiciones de terceros",vence:sumarHabiles(p.fechaPublicacion,30),info:true,norma:"Art. 146 D. 486"});
  if(conc){let ini=conc;for(let c=1;c<=3;c++){const fin=sumarAnios(conc,10*c);
    add({clave:"renovacion-"+c,tipo:`Renovar la marca (renovación ${c})`,vence:fin,gracia:sumarMeses(fin,6),norma:"Arts. 152 y 153 D. 486",nota:"Se puede renovar desde 6 meses antes del vencimiento; hay 6 meses de gracia."});ini=fin}
   add({clave:"uso",tipo:"Usar la marca en el mercado",vence:sumarAnios(conc,3),norma:"Art. 165 D. 486",nota:"Sin uso durante 3 años seguidos, un tercero puede pedir la cancelación."})}
 }
 return ev.sort((a,b)=>a.vence.localeCompare(b.vence));
}

/* Estado de un evento en una fecha dada */
function estado(e,hoy){
 if(e.hecho)return{cls:"v",txt:"Hecho",nivel:0};
 if(!e.vence)return{cls:"g",txt:"Sin fecha",nivel:1};
 const d=dias(e.vence,hoy);
 if(e.opcional&&d<0)return{cls:"g",txt:"Ya pasó",nivel:0};
 if(e.info)return d<0?{cls:"g",txt:"Ya pasó",nivel:0}:{cls:"g",txt:(e.estimado?"Estimado · ":"")+`faltan ${d} d`,nivel:1};
 if(d<0){if(e.gracia&&dias(e.gracia,hoy)>=0)return{cls:"a",txt:`En gracia con recargo: faltan ${dias(e.gracia,hoy)} d`,nivel:3};return{cls:"r",txt:`Vencido hace ${-d} d`,nivel:4}}
 if(d===0)return{cls:"r",txt:"Vence hoy",nivel:4};
 if(d<=15)return{cls:"a",txt:`Faltan ${d} d`,nivel:3};
 return{cls:"",txt:(e.estimado?"Estimado · ":"")+`faltan ${d} d`,nivel:2};
}

/* Etapa que corresponde según el expediente */
function etapaSugerida(p,hoy){const k=clase(p.modalidad);if(!["pi","mu","di","ma"].includes(k))return null;
 const fin=eventos(p).find(e=>e.clave==="fin");
 if(valida(p.fechaNegacion))return"negada";
 if(valida(p.fechaConcesion)){if(fin&&dias(fin.vence,hoy)<0)return"vencida";return p.etapa==="licenciada"?"licenciada":"concedida"}
 if(valida(p.fechaPeticionFondo)||valida(p.fechaReqFondo))return"examen";
 if(valida(p.fechaRadicacion))return"radicada";
 return null}

/* Requisitos para radicar */
function requisitos(p){const k=clase(p.modalidad);const L=[];
 if(k==="pi"||k==="mu"){L.push(["petitorio","Petitorio (formulario de la SIC) diligenciado","Art. 26 D. 486"],["descripcion","Descripción clara y completa","Arts. 26 y 28"],["reivindicaciones","Reivindicaciones","Arts. 26 y 30"],["dibujos","Dibujos","Art. 26"],["resumen","Resumen","Art. 26"],["tasa","Comprobante de pago de la tasa de solicitud","Art. 26"])}
 else if(k==="di"){L.push(["petitorio","Petitorio (formulario de la SIC)","Art. 117"],["vistas","Representación gráfica con todas las vistas (líneas continuas)","Art. 117"],["tasa","Comprobante de pago de la tasa","Art. 117"])}
 else if(k==="ma"){L.push(["petitorio","Petitorio con el signo y la clase de Niza","Art. 138"],["tasa","Comprobante de pago de la tasa","Art. 138"])}
 else return L;
 const inv=(p.inventores||"").trim().toLowerCase(),sol=(p.solicitante||"").trim().toLowerCase();
 if(k!=="ma"&&sol&&inv&&!sol.includes(inv)&&!inv.includes(sol))L.push(["cesion","Documento de cesión del inventor al solicitante","Art. 26 lit. h"]);
 if(p.agente)L.push(["poder","Poder al agente o abogado","Art. 26"]);
 if(valida(p.fechaPrioridad))L.push(["prioridadDoc","Datos de la solicitud de prioridad","Art. 9-10"]);
 if(k==="pi"||k==="mu")L.push(["busqueda","Búsqueda de antecedentes hecha (recomendado)","Buena práctica"]);
 return L}

/* Alertas legales del proyecto */
function alertas(p,hoy,licencias){const A=[];const k=clase(p.modalidad);const R=valida(p.fechaRadicacion)?p.fechaRadicacion:null;
 if(valida(p.fechaPrioridad)&&R){const lim=sumarMeses(p.fechaPrioridad,k==="pi"||k==="mu"?12:6);if(R>venceHabil(lim))A.push("La radicación es posterior al plazo de prioridad: la prioridad extranjera no es válida (art. 9).")}
 const refDiv=valida(p.fechaPrioridad)&&R&&p.fechaPrioridad<R?p.fechaPrioridad:R;
 if((k==="pi"||k==="mu")&&valida(p.fechaDivulgacion)&&refDiv&&refDiv>venceHabil(sumarMeses(p.fechaDivulgacion,12)))A.push("Se radicó más de un año después de divulgar el invento: la novedad puede estar destruida (art. 17).");
 if(valida(p.fechaConcesion)&&R&&p.fechaConcesion<R)A.push("La fecha de concesión es anterior a la de radicación. Revise las fechas.");
 if(valida(p.fechaPublicacion)&&R&&p.fechaPublicacion<R)A.push("La fecha de publicación es anterior a la de radicación. Revise las fechas.");
 for(const e of eventos(p))if(e.critico&&!e.hecho&&estado(e,hoy).nivel===4&&!(e.gracia&&dias(e.gracia,hoy)>=0))A.push(`Plazo vencido: “${e.tipo}” (${e.norma}). La solicitud puede estar en abandono o caducada; consulte a su agente.`);
 for(const e of eventos(p))if(e.clave.startsWith("anualidad-")&&!e.hecho&&e.gracia&&dias(e.gracia,hoy)<0){A.push(`No se pagó la “${e.tipo}” ni en el período de gracia: la protección pudo caducar (art. 80). Si ya la pagó, márquela como hecha.`);break}
 const L=(licencias||[]).filter(l=>l.proyectoId===p.id&&l.etapa==="firmado");
 if(L.filter(l=>l.tipo==="Licencia exclusiva").length>1)A.push("Hay más de una licencia exclusiva firmada para este proyecto. Una licencia exclusiva no permite otra igual en el mismo territorio.");
 if(L.some(l=>l.tipo==="Licencia exclusiva")&&L.length>1)A.push("Hay una licencia exclusiva y otros acuerdos firmados: revise que no se crucen territorios ni usos.");
 if(L.length&&!R&&["pi","mu","di","ma"].includes(k))A.push("Hay acuerdos firmados antes de radicar: asegúrese de que tengan cláusula de confidencialidad.");
 return A}

/* Cronograma: cada grupo con meta "1 producto cada N meses" desde metaDesde */
function cronograma(){const H=hoyISO();const L=[];
 for(const g of grupos()){const N=+(g.metaMeses??2);if(!N)continue;const ini=M.valida(g.metaDesde)?g.metaDesde:H.slice(0,8)+"01";
  const fechas=prodsDe(g.id).filter(p=>esProducto(p)&&M.valida(p.fechaGrupLAC)).map(p=>p.fechaGrupLAC);
  const cand=prodsDe(g.id).filter(p=>!esProducto(p)&&!["descartada","negada","vencida"].includes(p.etapa)).sort((a,b)=>(!!reqMin(a)-!!reqMin(b))||(a.codigo||"").localeCompare(b.codigo||""));
  const G=[];let fut=false;
  for(let i=0;i<240;i++){const a=sumar(ini,i*N),b=sumar(ini,(i+1)*N,-1);if(a>H){if(fut)break;fut=true}
   const n=fechas.filter(f=>f>=a&&f<=b).length;G.push({grupo:g,desde:a,vence:b,cumplida:n>0,n})}
  const abiertas=G.filter(x=>!x.cumplida&&x.vence>=H),venc=G.filter(x=>!x.cumplida&&x.vence<H).reverse();let ci=0;
  for(const x of[...abiertas,...venc]){const c=cand[ci++];if(!c)break;x.proy=c;x.req=reqMin(c)}
  L.push(...G)}
 return L.sort((a,b)=>a.vence.localeCompare(b.vence))}
function estMeta(x){const H=hoyISO();if(x.cumplida)return{cls:"v",txt:"Cumplida",nivel:0};const d=diasA(x.vence);if(x.vence<H)return{cls:"r",txt:"Vencida",nivel:4};if(d<=15)return{cls:"a",txt:`Vence en ${d} d`,nivel:3};return{cls:"",txt:"Pendiente",nivel:1}}
function avisosGrupos(){const H=hoyISO();const cr=cronograma();const lim=sumar(H,-3);
 const vg={};for(const x of cr)if(estMeta(x).nivel===4)(vg[x.grupo.id]=vg[x.grupo.id]||[]).push(x);
 return{vencidas:cr.filter(x=>estMeta(x).nivel===4),vencPorGrupo:Object.values(vg),proximas:cr.filter(x=>estMeta(x).nivel===3),
  sinProd:grupos().filter(g=>{const u=ultimoProd(g.id);if(u)return u<lim;return!!(M.valida(g.metaDesde)&&g.metaDesde<lim)}),proxima:cr.find(x=>!x.cumplida&&x.vence>=H)}}

function leerCSV(t){const filas=[];let f=[],c="",q=false;const sep=(t.split("\n")[0].match(/;/g)||[]).length>(t.split("\n")[0].match(/,/g)||[]).length?";":",";
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===sep){f.push(c);c=""}else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&t[i+1]==="\n")i++;f.push(c);c="";if(f.some(x=>x.trim()))filas.push(f);f=[]}else c+=ch}
 f.push(c);if(f.some(x=>x.trim()))filas.push(f);return filas}

 const cab=F[0].map(x=>x.trim().toLowerCase());const col=(...n)=>cab.findIndex(h=>n.some(k=>h.includes(k)));const ci={t:col("título","titulo","nombre","proyecto"),pr:col("problema"),so:col("solución","solucion","descrip"),mo:col("modalidad"),se:col("sector"),inv:col("inventor","autor"),no:col("nota")};
 if(ci.t<0){toast("Falta la columna “Título”. La primera fila debe tener los nombres de las columnas.");return}
 const filas=F.slice(1).filter(r=>(r[ci.t]||"").trim()).slice(0,300);
 confirmar(`Se van a crear ${filas.length} proyecto(s) desde el archivo. ¿Continuar?`,async()=>{let n=0;for(const r of filas){const g=k=>ci[k]>=0?String(r[ci[k]]||"").trim():"";const mod=MODALIDADES.find(m=>m.toLowerCase()===g("mo").toLowerCase())||"Modelo de utilidad";const sec=SECTORES.find(s=>s.toLowerCase()===g("se").toLowerCase())||"Otro";
  const id=uid();const p={codigo:nuevoCodigo(),titulo:g("t").slice(0,200),modalidad:mod,sector:sec,etapa:"idea",problema:g("pr"),solucion:g("so"),inventores:g("inv")||(YO?YO.nombre:""),solicitante:ORG?ORG.nombre:"",notas:g("no"),borrador:{},creado:new Date().toISOString()};local("proyectos",id,p);if(await guardar("proyectos",id,p))n++}toast(`${n} proyecto(s) importado(s).`);ir("proyectos")},"Importar")};inp.click()}

  antecedentes:`En la actualidad existen soluciones para ${prob?prob.charAt(0).toLowerCase()+prob.slice(1).replace(/\.$/,""):"[el problema]"}.\n\n${String(p.antecedentesHallados||"").trim()?`Entre los antecedentes encontrados están:\n${p.antecedentesHallados}\n\n`:"[Describa aquí los productos o documentos de patente existentes, con su número si lo tiene.]\n\n"}Estas soluciones presentan las siguientes limitaciones: [explique en qué fallan o qué no resuelven].`,

function etapaRuta(p,r){if(["descartada","negada","vencida"].includes(p.etapa))return null;

 if(sug==="concedida"&&S.licencias.some(l=>l.proyectoId===p.id&&l.etapa==="firmado"))sug="licenciada";
 if(!sug&&["da","si","ob"].includes(r.k)&&S.licencias.some(l=>l.proyectoId===p.id&&l.etapa==="firmado"))sug="licenciada";
 if(!sug&&!r.R&&r.cur&&!["da","si","ob"].includes(r.k)){const c=r.cur.k;sug=c==="describir"?"idea":["evaluar","antecedentes"].includes(c)?"evaluacion":["redactar","dibujos","proteger","requisitos","radicar"].includes(c)?"redaccion":null;

 return sug}

 return`${A.length?`<div class="alerta" role="alert"><b>Revise esto</b><ul>${A.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`:""}

async function dibujar(id){const p=proy(id);const pedido=($("#dib-pedido")?.value||"").trim()||"vista principal del invento";await conIA("dib"+id,async()=>{
 const r=await sample(`${BASE}\n\nDibuja una figura para la solicitud: "${pedido}".\nReglas: responde SOLO con un elemento <svg> válido (xmlns="http://www.w3.org/2000/svg", viewBox definido, máximo 600x600), estilo de dibujo de patente: solo líneas negras sobre fondo blanco (fill="none" o "#fff"), stroke="#000", sin colores, sin texto descriptivo salvo los números de referencia (font-family Arial, font-size 14) con líneas guía finas. Usa los mismos números de referencia de la descripción si existen. Sin <script>, sin imágenes externas, sin estilos CSS.\n\n${contextoProy(p)}`,{modelTier:"complex",cache:false});
 const m=r.text.match(/<svg[\s\S]*<\/svg>/i);const svg=m&&limpiarSvg(m[0]);if(!svg)throw{code:"invalid_json"};
 if(svg.length>200000)throw{code:"prompt_too_large"};if(!proy(id))return;
 const did=uid();const x={proyectoId:id,titulo:pedido,svg,fecha:hoyISO(),creado:new Date().toISOString()};local("dibujos",did,x);if(await guardar("dibujos",did,x)){toast("Boceto agregado");limpiarTmp("dib-")}})}
function limpiarSvg(t){try{const d=new DOMParser().parseFromString(t,"image/svg+xml");const s=d.documentElement;if(!s||s.nodeName.toLowerCase()!=="svg"||d.getElementsByTagName("parsererror").length)return null;
 for(const tag of ["script","foreignObject","iframe","image","use","style","animate","set","animateTransform","a"])for(const n of [...s.getElementsByTagName(tag)])n.remove();
 for(const n of [s,...s.getElementsByTagName("*")])for(const at of [...n.attributes])if(/^on/i.test(at.name)||/href$/i.test(at.name)||/javascript:|data:|url\(/i.test(at.value))n.removeAttribute(at.name);
 if(!s.getAttribute("xmlns"))s.setAttribute("xmlns","http://www.w3.org/2000/svg");return new XMLSerializer().serializeToString(s)}catch(e){return null}}
function dibujosDe(p){return[...(p.dibujos||[]).map((d,i)=>({...d,ref:"L"+i})),...S.dibujos.filter(x=>x.proyectoId===p.id).sort((a,b)=>(a.creado||"").localeCompare(b.creado||"")).map(d=>({...d,ref:"D"+d.id}))]}

document.addEventListener("input",ev=>{const el=ev.target;if(el.dataset.campo||el.dataset.bor){if(el.tagName!=="SELECT"&&el.type!=="date"&&el.type!=="checkbox")campoCambia(el)}else if(el.id==="busca"){ui.busca=el.value;const pos=el.selectionStart;render();const b=$("#busca");b.focus();b.setSelectionRange(pos,pos)}
 else if(el.id==="d-texto")ui.docTexto=el.value;
 else if(el.id==="i-problema")ideasForm.problema=el.value;else if(el.id==="i-contexto")ideasForm.contexto=el.value});
document.addEventListener("change",ev=>{const el=ev.target;
 if(el.dataset.urol){api("PATCH","/api/usuarios/"+encodeURIComponent(el.dataset.urol),{rol:el.value}).then(()=>{ui.usuarios=null;render();toast("Rol cambiado")}).catch(e=>{toast(e.message||"No se pudo cambiar.");ui.usuarios=null;render()});return}
 if(el.id==="rolDemo"){YO.rol=el.value;ui.rolDemo=el.value;if(vista==="empresa")ui.subEmp=null;render();return}

 if(el.dataset.gru){const pid=el.dataset.gru,v=el.value,pp=proy(pid);if(pp&&esProducto(pp)&&v!==pp.grupoId){render();confirmar("Este producto ya está registrado en GrupLAC con su grupo actual. Si lo cambia de grupo, su estado en GrupLAC vuelve a “Sin registrar”. ¿Cambiarlo?",async()=>{await parchear("proyectos",pid,{grupoId:v,lineaId:"",estadoGrupLAC:"",fechaGrupLAC:""});render()},"Cambiar de grupo")}else{parchear("proyectos",pid,{grupoId:v,lineaId:""});render()}}
 else if(el.dataset.gl){marcarGL(el.dataset.gl,el.value)}
 else if(el.dataset.aval){const L=grupos().map(g=>g.id===el.dataset.aval?{...g,aval:el.value}:g);guardarG({lista:L});toast(el.value==="avalado"?"Grupo marcado como avalado":"Grupo marcado sin aval")}
 else if(el.dataset.pendg){const P=((cfgG()||{}).pendientes||[]).map(x=>x.id===el.dataset.pendg?{...x,hecho:el.checked,hechoEl:el.checked?hoyISO():""}:x);guardarG({pendientes:P})}
 else if(el.dataset.campo&&(el.tagName==="SELECT"||el.type==="date"))campoCambia(el);
 else if(el.dataset.campo&&el.type==="checkbox"){parchear("proyectos",el.dataset.id,{[el.dataset.campo]:el.checked});render()}
 else if(el.id==="filtroEtapa"){ui.filtroEtapa=el.value;render()}
 else if(el.id==="i-sector")ideasForm.sector=el.value;
 else if(el.dataset.hecho){parchear("tramites",el.dataset.hecho,{estado:el.checked?"hecho":"pendiente"});render()}
 else if(el.dataset.hechoder){const[pid,cl]=el.dataset.hechoder.split("|");parchear("proyectos",pid,{hechos:{[cl]:el.checked?hoyISO():false}});render()}
 else if(el.dataset.req){const[pid,key]=el.dataset.req.split("|");parchear("proyectos",pid,{checklist:{[key]:el.checked}});render()}
 else if(el.dataset.licreg){parchear("licencias",el.dataset.licreg,{registrada:el.checked});render()}
 else if(el.dataset.licfirma){parchear("licencias",el.dataset.licfirma,{fechaFirma:el.value});render()}
 else if(el.id==="verTodo"){ui.verTodo=el.checked;render()}
 else if(el.id==="d-tipo"){ui.docTipo=el.value;ui.docTexto="";ui.docTitulo="";render()}
 else if(el.id==="d-lic"){const l=S.licencias.find(x=>x.id===el.value);if(l){$("#d-empresa").value=l.empresa;if($("#d-excl"))$("#d-excl").value=l.tipo==="Licencia exclusiva"?"si":"no"}}
 else if(el.dataset.tarifa){if((+tarifas()[el.dataset.tarifa]||0)===(+el.value||0))return;const T={...tarifas()};delete T.id;T[el.dataset.tarifa]=+el.value||0;local("config","tarifas",T);guardar("config","tarifas",T);toast("Tarifa guardada")}
 else if(el.dataset.licetapa){const l=S.licencias.find(x=>x.id===el.dataset.licetapa);const pt={etapa:el.value};if(el.value==="firmado"&&!(l&&l.fechaFirma))pt.fechaFirma=hoyISO();parchear("licencias",el.dataset.licetapa,pt);render()}});
document.addEventListener("focusout",ev=>{const el=ev.target;if(!el||!el.dataset)return;const k=el.dataset.campo||el.dataset.bor;const id=el.dataset.id;if(!k||!id)return;
 if(!(el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&(el.type==="text"||el.type==="date"))))return;
 if(el.type==="date"&&el.value&&!M.valida(el.value))return;
 const key=id+k;clearTimeout(tCampo[key]);delete pendCampo[key];const p=proy(id);if(!p)return;
 const v=el.value,esCampo=!!el.dataset.campo;setTimeout(()=>{const q=proy(id);if(!q)return;if(esCampo){if((q[k]??"")!==v)parchear("proyectos",id,{[k]:v})}else if(((q.borrador||{})[k]??"")!==v)parchear("proyectos",id,{borrador:{[k]:v}})},0)},true);

function confirmar(msg,fn,etq="Eliminar"){$("#capa").innerHTML=`<div class="modal-f"><div class="modal" role="dialog" aria-modal="true"><h2>Confirmar</h2><p style="margin:0">${esc(msg)}</p><div class="fila" style="justify-content:flex-end"><button class="btn sec" id="c-no">Cancelar</button><button class="btn pri" id="c-si" style="background:var(--rojo)">${esc(etq)}</button></div></div></div>`;
 $("#c-no").onclick=()=>$("#capa").innerHTML="";$("#c-si").onclick=()=>{$("#capa").innerHTML="";fn()};$("#c-no").focus()}

/* ---------- Arranque ---------- */
function estado(cls,txt){const e=$("#estado");e.className="estado "+cls;e.querySelector("span").textContent=txt}
async function iniciar(){
 if(REMOTO){await iniciarRemoto();return}
 if(window.PATENTIA_DEMO){downloads=descargasLocales;try{const d=await window.claude?.use?.("downloads");if(d)downloads=d}catch(e){}iniciarDemo();return}
 MODO="claude";ORG={id:"skynet",nombre:"SkyNet Genesis",modulos:Object.fromEntries(Object.keys(MOD_INFO).map(m=>[m,true])),pago:{estado:"activa"},valor:PRECIOS.mensual,interna:true};YO={id:"local",nombre:"Ricardo Londoño González",email:"rikardolondono@gmail.com",rol:"admin"};
 const c=window.claude;
 const [d,s,dl,as]=await Promise.all([c?.use?.("db"),c?.use?.("sample"),c?.use?.("downloads"),c?.use?.("assets")].map(p=>Promise.resolve(p).catch(()=>null)));
 db=d||null;sample=s||null;downloads=dl||null;assets=as||null;
 if(!db){cargado=true;estado("loc","Modo de prueba");render();return}
 estado("ok","Guardado en la nube");suscribir()}
function suscribir(){let faltan=new Set(COL);let migrado=false;
 for(const col of COL){db.collection(col).onSnapshot(sn=>{S[col]=sn.docs.map(x=>({id:x.id,...x.data()}));faltan.delete(col);if(!faltan.size)cargado=true;
  if(col==="tramites"&&!migrado){migrado=true;for(const t of S.tramites.filter(t=>t.sugerido&&t.estado!=="hecho"))borrar("tramites",t.id)}
  pedirRender()},e=>{ui.errCarga=true;faltan.delete(col);if(!faltan.size)cargado=true;estado("loc","Sin conexión a los datos");pedirRender()})}}

/* ---------- Versión con servidor (patentes.skynetgenesis.com) ---------- */
let TOKEN="";try{TOKEN=localStorage.getItem("patentia_token")||""}catch(e){}
async function api(method,path,body){let r;try{r=await fetch(API+path,{method,headers:{"Content-Type":"application/json",...(TOKEN?{Authorization:"Bearer "+TOKEN}:{})},body:body?JSON.stringify(body):undefined})}catch(e){throw{code:"unavailable",message:"No hay conexión con el servidor. Revise su internet. Si es temprano en la mañana, el servidor puede tardar hasta un minuto en despertar."}}
 const j=await r.json().catch(()=>({}));if(r.status===401&&TOKEN&&!/login|restablecer|olvide|registro/.test(path)){const sup=lsGet("patentia_token_super");if(sup&&sup!==TOKEN){lsSet("patentia_token_super",null);TOKEN=sup;lsSet("patentia_token",sup);toast("Terminó el modo administrador. Volviendo al panel del Superadministrador.");setTimeout(()=>location.reload(),1200);throw{code:"revoked"}}TOKEN="";lsSet("patentia_token",null);pantallaAcceso("entrar",j.error||"Su sesión venció. Vuelva a entrar.");throw{code:"revoked"}}
 if(!r.ok)throw{code:j.code||(r.status===413?"invalid_argument":r.status===429?"resource_exhausted":r.status===402||r.status===423?"bloqueo":r.status===403?"permiso":"unavailable"),message:j.error||"Error del servidor",status:r.status,bloqueo:j.bloqueo,modulo:j.modulo};return j}
function crearDbRemota(){const subs={};let ver="",cache={},tPoll=null,enCurso=null,detenido=false;
 const entregar=()=>{for(const c in subs){const docs=(cache[c]||[]).map(d=>{const{id,...data}=d;return{id,exists:true,data:()=>data}});for(const f of subs[c])f.next({docs,size:docs.length,empty:!docs.length})}};
 async function sondear(){if(enCurso)return enCurso;enCurso=(async()=>{try{const j=await api("GET","/api/datos?v="+encodeURIComponent(ver));estado("ok","Guardado en el servidor");if(j.org){const cambio=JSON.stringify(j.org)!==JSON.stringify(ORG);ORG=j.org;if(cambio&&j.sinCambios)pedirRender()}if(!j.sinCambios){ver=String(j.version);cache=j.datos||{};entregar()}}
  catch(e){if(e.code==="bloqueo"){detenido=true;clearTimeout(tPoll);pantallaBloqueo(e);return}if(e.code!=="revoked"){estado("loc","Sin conexión con el servidor");for(const c in subs)for(const f of subs[c])f.err&&f.err(e)}}finally{enCurso=null}})();return enCurso}
 const programar=(ms)=>{if(detenido)return;clearTimeout(tPoll);tPoll=setTimeout(async()=>{if(document.visibilityState==="visible"||!ver)await sondear();programar(20000)},ms)};
 document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")programar(0)});
 const escribir=async(m,col,id,d)=>{const j=await api(m,`/api/doc/${encodeURIComponent(col)}/${encodeURIComponent(id)}`,d);programar(400);return j};
 return{collection(col){return{onSnapshot(next,err){(subs[col]=subs[col]||[]).push({next,err});programar(0);return()=>{}},
  doc(id){return{id,set:d=>escribir("PUT",col,id,d).then(()=>{}),update:d=>escribir("PATCH",col,id,d).then(()=>{}),delete:()=>escribir("DELETE",col,id).then(()=>{}),
   get:async()=>{ver="";await sondear();const x=(cache[col]||[]).find(z=>z.id===id);if(!x)return{id,exists:false,data:()=>undefined};const{id:_,...data}=x;return{id,exists:true,data:()=>data}}}}}}}}
const descargasLocales={save({filename,data}){const blob=data instanceof Blob?data:new Blob([data]);const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return Promise.resolve({status:"saved"})}};
function restaurarRespaldo(){const inp=document.createElement("input");inp.type="file";inp.accept="application/json,.json";inp.onchange=async()=>{const f=inp.files[0];if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(e){toast("Ese archivo no es un respaldo de Patent-IA.");return}
 if(!Array.isArray(j.proyectos)){toast("Ese archivo no es un respaldo de Patent-IA.");return}
 confirmar(`Esto reemplaza TODOS los datos actuales por los del respaldo (${j.proyectos.length} proyectos). ¿Continuar?`,async()=>{try{const r=await api("POST","/api/importar",j);toast(`Respaldo restaurado: ${r.importados} registros.`);location.reload()}catch(e){toast(e.message||"No se pudo restaurar.")}},"Restaurar")};inp.click()}
render();iniciar();
})();
